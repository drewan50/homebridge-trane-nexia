name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the Release workflow runs this same gate before it publishes anything

permissions:
  contents: read

jobs:
  build:
    name: Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain (TypeScript 7, Homebridge 2 typings) is built once on a current Node. What users run is
      # the compiled dist/, so that is what every Node leg below exercises.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test on Node ${{ matrix.node-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runtime majors the plugin promises to run on (package.json "engines"); Homebridge Verified requires 22, 24 and 26.
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Smoke test the compiled plugin
        run: |
          node --version
          node -e "
            const entry = require('./dist/index.js');
            let registered;
            entry({ registerPlatform: (plugin, platform, ctor) => { registered = plugin + '/' + platform + ':' + typeof ctor; } });
            if (registered !== 'homebridge-trane-nexia/TraneNexia:function') { console.error('unexpected registration:', registered); process.exit(1); }
            console.log('plugin registered:', registered);
          "
      - name: Run the tests
        run: node --test test/*.test.js
