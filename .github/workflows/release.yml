name: Release

# Publishes to npm with trusted publishing (OIDC: no token anywhere) and creates the GitHub release.
#
# Two ways to release; both run the full CI gate first (Node 18-26) and the same checks:
#   1. Push a tag vX.Y.Z on a commit that is on main.
#   2. Actions -> Release -> Run workflow, on main, with "publish" ticked (this creates the tag and release).
# Running it without "publish" is a rehearsal: every check and a full `npm publish --dry-run`, nothing uploaded.
#
# One-time setup on npmjs.com (Trusted Publisher: GitHub Actions, workflow filename "release.yml") is in
# docs/ops/RELEASE.md. The filename of this file is part of that trust: don't rename it without redoing the setup.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (npm + GitHub release). Leave unticked for a rehearsal.'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  publish:
    name: ${{ github.event_name == 'push' && 'Publish' || (inputs.publish && 'Publish' || 'Rehearsal') }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the GitHub release
      id-token: write   # npm trusted publishing (OIDC) and the provenance attestation
    env:
      PUBLISH_INPUT: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history, to check the release commit is on main

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build

      - name: Decide what this run does
        id: mode
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PUBLISH_INPUT" = "true" ]; then mode=publish; else mode=rehearsal; fi
          VERSION=$(node -p "require('./package.json').version")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "This run will: $mode v$VERSION"

      - name: Check the release is ready
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          node --version; npm --version
          # Trusted publishing needs npm 11.5.1 or newer.
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing (needs 11.5.1+)"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/release.js check --tag "$GITHUB_REF_NAME"
          else
            node scripts/release.js check
          fi

          if [ "$MODE" = "publish" ]; then
            # Only ever release a commit that is on main.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$GITHUB_SHA is not on main: merge the release commit first"; exit 1; }
            # An existing tag must already point at this commit.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && [ "$(git rev-list -n1 "$TAG")" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on a different commit"; exit 1
            fi
          fi

      - run: npm ci
      - run: npm test

      - name: Is this version already on npm?
        id: published
        env:
          VERSION: ${{ steps.mode.outputs.version }}
          NODE_AUTH_TOKEN: '' # setup-node exports a dummy token; a read-only lookup must not send it
        run: |
          if npm view "homebridge-trane-nexia@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "v${VERSION} is already on npm; will not publish it again"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.mode.outputs.mode == 'publish' && steps.published.outputs.already != 'true'
        run: npm publish

      - name: Rehearsal (build, test and pack; nothing is uploaded)
        if: steps.mode.outputs.mode == 'rehearsal'
        run: |
          npm publish --dry-run
          echo "--- release notes that would be used ---"
          node scripts/release.js notes

      - name: Create the GitHub release
        if: steps.mode.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release.js notes > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            # Also creates the tag, on this commit, when it doesn't exist yet.
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
